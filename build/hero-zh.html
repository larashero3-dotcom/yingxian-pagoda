<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<style>
  @page { margin:0 }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1600px;height:600px;overflow:hidden;background:#F7F5EF;
    font-family:'Noto Sans CJK SC','Source Han Sans SC','PingFang SC',sans-serif;-webkit-font-smoothing:antialiased}
  .bar{height:14px;background:#28BD72}
  .grid{position:absolute;inset:14px 0 0 0;
    background-image:linear-gradient(#E4E1D8 1px,transparent 1px),
                     linear-gradient(90deg,#E4E1D8 1px,transparent 1px);
    background-size:74px 74px;opacity:.55}
  .wrap{position:relative;height:586px;display:flex;align-items:stretch}
  .L{flex:1;padding:66px 0 0 74px;display:flex;flex-direction:column}
  .kicker{font-family:'DejaVu Sans Mono',monospace;font-size:16px;letter-spacing:.20em;
    color:#5C5A52;font-weight:600}
  h1{font-size:88px;font-weight:800;color:#16150F;letter-spacing:-.022em;
    line-height:1.0;margin-top:20px}
  h1 .dot{color:#28BD72;font-family:'Noto Sans CJK SC','DejaVu Sans',sans-serif}
  .sub{font-size:25px;font-weight:600;color:#2C2A22;line-height:1.55;
    margin-top:26px;max-width:690px}
  .stats{display:flex;gap:0;margin-top:54px}
  .st{padding-right:48px;margin-right:48px;border-right:1px solid #D0CFCA}
  .st:last-child{border:0}
  .sv{font-size:34px;font-weight:800;color:#16150F;letter-spacing:-.01em;
    font-variant-numeric:tabular-nums}
  .sv em{font-style:normal;font-size:20px;font-weight:700;margin-left:5px}
  .sl{font-size:14px;color:#63615A;margin-top:7px;letter-spacing:.02em}
  .foot{margin-top:56px;padding-bottom:0;font-family:'DejaVu Sans Mono',monospace;
    font-size:14.5px;color:#6E6C64;letter-spacing:.01em}
  .R{width:520px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-left:1px solid #C9C7C0;margin:60px 0;padding:0 42px;text-align:center}
  .era{font-family:'DejaVu Sans',sans-serif;font-size:104px;line-height:1;font-weight:800;
    letter-spacing:-.06em;color:#16150F}
  .era-rule{width:92px;height:5px;background:#28BD72;margin:32px 0 27px;border-radius:2px}
  .era-label{font-size:25px;font-weight:700;color:#2C2A22;letter-spacing:.06em}
  .era-sub{font-family:'DejaVu Sans Mono',monospace;font-size:14px;color:#6E6C64;
    letter-spacing:.12em;margin-top:14px}
</style></head><body>
<div class="bar"></div>
<div class="wrap"><div class="grid"></div>
  <div class="L">
    <div class="kicker">OPEN&#8209;SOURCE&nbsp;&nbsp;WEB&nbsp;PROJECT</div>
    <h1>應縣木塔<span class="dot">.</span></h1>
    <div class="sub">一座辽代木塔的外观、内藏、结构、倾斜史与修缮方案之争，做成一个用手指看的竖屏网页。</div>
    <div class="stats"><div class="st"><div class="sv">970<em>年</em></div><div class="sl">站立至今</div></div><div class="st"><div class="sv">9<em>个</em></div><div class="sl">纪年刻度</div></div><div class="st"><div class="sv">4<em>种</em></div><div class="sl">修缮方案</div></div></div>
    <div class="foot">github.com/larashero3-dotcom/yingxian-pagoda</div>
  </div>
  <div class="R">
    <div class="era">1056</div>
    <div class="era-rule"></div>
    <div class="era-label">遼 · 佛宮寺釋迦塔</div>
    <div class="era-sub">木構樓閣式塔 · 山西應縣</div>
  </div>
</div></body></html>
